name: DriveGuard CI

on:
  push:
    branches: [main, master, "remediation/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Python Backend Tests & AI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AUTH_SECRET: "ci-secret-key-32-bytes-minimum-length-strictly-enforced"
      AUTH_TOKEN_ISSUER: "driveguard-frontend"
      AUTH_TOKEN_AUDIENCE: "driveguard-backend"
      LIVEKIT_URL: "wss://ci.livekit.cloud"
      LIVEKIT_API_KEY: "APICxxxxxxxxxxxx"
      LIVEKIT_API_SECRET: "ci_livekit_api_secret_key"
      PYTHONPATH: "."

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ || true

      - name: Run Backend PyTest Suite
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing

  frontend-test:
    name: Next.js Frontend Quality & Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/driveguard?sslmode=disable"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/driveguard?sslmode=disable"
      BETTER_AUTH_SECRET: "ci-better-auth-secret-key-32-bytes-minimum"
      BETTER_AUTH_URL: "http://localhost:3000"
      AUTH_SECRET: "ci-secret-key-32-bytes-minimum-length-strictly-enforced"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_FASTAPI_URL: "http://localhost:8000"
      FASTAPI_URL: "http://localhost:8000"
      NEXT_PUBLIC_LIVEKIT_URL: "wss://ci.livekit.cloud"
      LIVEKIT_URL: "wss://ci.livekit.cloud"
      LIVEKIT_API_KEY: "APICxxxxxxxxxxxx"
      LIVEKIT_API_SECRET: "ci_livekit_api_secret_key"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Audio Engine Unit Tests
        run: npm run test:audio

      - name: Run Camera & MediaDevices Unit Tests
        run: npm run test:camera

      - name: Run Security Guards & Telemetry Contract Tests
        run: npm run test:security

      - name: Build Next.js Web Cockpit
        run: npm run build
